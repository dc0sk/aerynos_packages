name        : reaction
version     : "2.5.1"
release     : 3
homepage    : https://reaction.ppom.me
upstreams   :
    - https://framagit.org/ppom/reaction/-/archive/v2.5.1/reaction-v2.5.1.tar.gz : ef333bad9b0c4a99acb2a4e50e5b1d0c70811941b765201165de358f44768eb0
summary     : A daemon that scans program outputs for repeated patterns, and takes action
description : |
    reaction scans program outputs (e.g. logs) for repeated patterns, and takes
    action. A common usage is to scan ssh and webserver logs, and to ban hosts
    that cause multiple authentication errors. reaction aims at being a
    successor to fail2ban.
license     : AGPL-3.0-only
builddeps   :
    # The nftables plugin binds libnftables, which was not packaged when this
    # recipe was first written - that, plus the ipset plugin, is why the build
    # and the check phase used to be scoped to the reaction crate alone.
    - nftables-devel
rundeps     :
    # The shipped default configuration bans via a dedicated iptables chain.
    - sysbinary(iptables)
    - sysbinary(ip6tables)
networking  : true
setup       : |
    %cargo_fetch
build       : |
    # --workspace is required, not implied: the root Cargo.toml is both a
    # package and the workspace root, so a plain `cargo build` there builds only
    # the reaction crate and the plugin binaries never appear.
    #
    # reaction-plugin-ipset is excluded, and packaging libipset did not change
    # that. The blocker simply moved: the ipset crate 0.9.0 generates its
    # bindings with bindgen against libipset 7.24 and the generated layout
    # assertions do not hold - size_of::<_IO_FILE>() comes out as 1 rather than
    # 216, which is bindgen's signature for a struct it ended up treating as
    # opaque - so the crate fails to compile with a handful of E0080 errors.
    # That is a mismatch between the crate and this libipset, not something the
    # recipe can set right.
    #
    # reaction-plugin-cluster stays in the build graph even though it is not
    # shipped. Excluding a member does not merely drop it: cargo unifies
    # features across the graph, and cluster pulls treedb in alongside reaction,
    # so removing it changes which treedb features reaction itself is compiled
    # with. Doing that made the filter_struct persistence test fail
    # reproducibly, its replay step finding an empty file. Its unusable tests
    # are skipped by name in the check phase instead.
    %cargo_build --workspace --exclude reaction-plugin-ipset
install     : |
    # reaction plus the nftables backend. reaction-plugin-cluster and
    # reaction-plugin-virtual are left out deliberately: cluster's own tests are
    # marked "failing for now" upstream, and virtual exists to support the test
    # suite rather than to be deployed. reaction-plugin-ipset cannot be built at
    # all; see the build phase.
    %cargo_install reaction reaction-plugin-nftables

    %install_dir %(installroot)%(mandir)/man1
    cp %(cargo_target_dir)/*.1 %(installroot)%(mandir)/man1/.

    %install_file %(cargo_target_dir)/reaction.bash %(installroot)%(bashcompletionsdir)/reaction
    %install_file %(cargo_target_dir)/reaction.fish %(installroot)%(fishcompletionsdir)/reaction.fish
    %install_file %(cargo_target_dir)/_reaction %(installroot)%(zshcompletionsdir)/_reaction

    %install_file %(pkgdir)/reaction.service -t %(installroot)%(libdir)/systemd/system
    %install_file %(pkgdir)/system-reaction.slice -t %(installroot)%(libdir)/systemd/system

    # Upstream's fully annotated reference configurations, for admins to crib from.
    %install_file config/example.yml %(installroot)%(datadir)/%(name)/example.yml
    %install_file config/example.jsonnet %(installroot)%(datadir)/%(name)/example.jsonnet

    # AerynOS is stateless/hermetic-usr: /etc ships empty and is seeded on first
    # boot. reaction.service runs `reaction start -c /etc/reaction/`, and reaction
    # builds its config from every *.yml/*.jsonnet in that directory - so an empty
    # /etc/reaction leaves the daemon with no streams to watch and nothing to do.
    # Ship a working default under %(vendordir) and copy it into place with a
    # tmpfiles `C` line, which never overwrites an admin's edited copy.
    %install_file %(pkgdir)/reaction.yml %(installroot)%(vendordir)/%(name)/reaction.yml

    %tmpfiles "d /etc/reaction 0755 root root -"
    %tmpfiles "C /etc/reaction/reaction.yml 0644 root root - %(vendordir)/%(name)/reaction.yml"
check       : |
    # Not %cargo_test, which hardcodes a bare --workspace and would pull in
    # reaction-plugin-ipset; the exclusion has to be spelled out. This is still
    # far wider than the reaction crate alone that used to be tested.
    #
    # plugin_virtual is skipped: that upstream test shells out to a nested
    # `cargo build -p reaction-plugin-virtual` and then copies target/debug/, which
    # cannot work inside an offline --frozen build of a --release --target tree. It
    # times out rather than failing fast. That is a test-harness assumption, not a
    # defect in reaction; every other test runs for real.
    # The cluster tests are skipped by name rather than by excluding the crate,
    # which would change feature unification and with it reaction's own build.
    # secret_key_get asserts that writing to /root/non_existent fails, which it
    # does not when the build runs as root. The rest - the e2e pair, run_with_self
    # and conf_stream - all end up constructing a cluster endpoint, which fails
    # with "Missing or incompatible rustls crypto provider configured" in this
    # dependency graph. Upstream already marks the equivalent top-level cluster
    # tests "failing for now".
    cargo test %(options_cargo_release) --workspace \
        --exclude reaction-plugin-ipset \
        -- --skip plugin_virtual \
           --skip secret_key_get \
           --skip two_nodes_simultaneous_startup \
           --skip n_nodes_simultaneous_startup \
           --skip run_with_self \
           --skip conf_stream
