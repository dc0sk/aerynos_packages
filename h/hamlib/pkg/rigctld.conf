# Options passed to rigctld by rigctld.service; see rigctld(1).
#
# -m MODEL  Hamlib rig model number; `rigctl -l` lists them. Model 1 is
#           Hamlib's built-in dummy rig - it controls nothing. It is here so
#           that the service starts and can be tried out of the box; replace
#           it with your radio's model.
# -r DEVICE serial or USB device the radio is attached to, e.g. /dev/ttyUSB0.
#           Serial devices are reachable via the dialout group, which the
#           service runs with; the dummy rig needs none.
# -s SPEED  serial baud rate, if the radio's default is not right.
# -T ADDR   address to listen on. rigctld's own default is EVERY interface,
#           which hands anyone on the network control of the radio, including
#           transmit - so this is pinned to loopback. Change it deliberately.
# -t PORT   TCP port (4532 is the conventional one).
RIGCTLD_OPTS="-m 1 -T 127.0.0.1 -t 4532"
