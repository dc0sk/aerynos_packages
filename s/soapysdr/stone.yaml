name        : soapysdr
version     : "0.9.0"
release     : 2
homepage    : https://github.com/pothosware/SoapySDR
upstreams   :
    - https://github.com/pothosware/SoapySDR/archive/refs/tags/soapy-sdr-0.9.0.tar.gz : 64f97c1ad241156fe299acb8902169019eab34517cd580b563968a43d7533509
summary     : Vendor neutral and platform independent SDR support library
description : |
    SoapySDR presents one API for software defined radio hardware, with
    per-device support supplied by plugin modules loaded at runtime. It ships
    the SoapySDRUtil probe and enumeration tool alongside the library.
license     : BSL-1.0
builddeps   :
    - binary(swig)
    - python-devel
setup       : |
    # CMAKE_POLICY_VERSION_MINIMUM: upstream still declares an old
    # cmake_minimum_required, and CMake 4 removed compatibility with anything
    # below 3.5, so it refuses to configure. This is the escape hatch CMake
    # itself points at in the error, and is less invasive than rewriting
    # upstream's build files.
    #
    # ENABLE_PYTHON3 is the switch for the bindings since 0.9.0 (0.8.1 called
    # it ENABLE_PYTHON). It is a dependent option, so it falls back to off
    # silently when swig or python are missing; the build succeeds and ships
    # no python module. The builddeps above are what keep it on.
    %cmake \
        -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
        -DENABLE_PYTHON3=ON
build       : |
    %cmake_build
install     : |
    %cmake_install
check       : |
    %cmake_test
