name        : tpm2-tools
version     : "5.8"
release     : 1
homepage    : https://tpm2-software.github.io/
upstreams   :
    - https://github.com/tpm2-software/tpm2-tools/releases/download/5.8/tpm2-tools-5.8.tar.gz : 1cb73185cae814b4e15c7c2d0b22642d640faf48775f4156a1fd92edf84bef73
summary     : Command line tools for the TPM 2.0 software stack
description : |
    tpm2-tools provides command line utilities built on the TPM2 Software
    Stack for working with TPM 2.0 devices: creating and managing keys and
    hierarchies, sealing and unsealing data, PCR and NV operations, quoting
    and attestation, and reading the event log.
license     : BSD-3-Clause
tuning      :
    # Linking tools/fapi/tss2 fails under the default thin LTO with
    # "ld.lld: error: Expected at most one ThinLTO module per bitcode file".
    - lto: false
builddeps   :
    # --enable-unit makes configure hard-require the abrmd binary and a TPM
    # simulator before it will complete, which is why this package had no check
    # phase at all until tpm2-abrmd was packaged. swtpm was already available.
    # The rest of this list exists only to get past configure. Enabling unit
    # tests makes it demand every program its *system* tests would use, even
    # though those are excluded from the check phase below. They are small, and
    # declaring them honestly beats lying to configure with cache variables.
    # pandoc is not optional in practice: Makefile.am hooks the check target to
    # fail without it, and without it the package also ships no man pages,
    # since configure quietly downgrades those to "will not be built".
    - binary(pandoc)
    - binary(expect)
    - binary(openssl)
    - binary(python)
    - binary(xxd)
    - perl
    - python-pyyaml
    - sysbinary(ss)
    - binary(swtpm)
    - pkgconfig(cmocka)
    - pkgconfig(libcrypto)
    - sysbinary(tpm2-abrmd)
    - pkgconfig(libcurl)
    - pkgconfig(tss2-esys)
    - pkgconfig(tss2-fapi)
    - pkgconfig(tss2-mu)
    - pkgconfig(tss2-rc)
    - pkgconfig(tss2-sys)
    - pkgconfig(tss2-tctildr)
setup       : |
    # --with-bashcompdir is set explicitly rather than left to the
    # bash-completion pkgconfig probe, so the install location does not depend
    # on whether bash-completion happens to be in the build environment.
    # The build container's PATH is /usr/bin:/bin only, and tpm2-abrmd installs
    # to /usr/sbin, so configure's AC_CHECK_PROG cannot see it without help.
    export PATH="$PATH:%(sbindir)"

    %configure \
        --enable-unit \
        --with-bashcompdir=%(bashcompletionsdir)
build       : |
    %make
install     : |
    %make_install
check       : |
    # Enabling unit tests also appends the system and FAPI suites to TESTS, and
    # those drive a live simulator over a socket rather than just linking
    # against cmocka. Override TESTS with the cmocka binaries so the check
    # phase is the unit suite only. The single quotes matter: make has to
    # receive the variable reference intact and expand it itself, rather than
    # the shell trying to run it.
    %make check TESTS='$(check_PROGRAMS)'
