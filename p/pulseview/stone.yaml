name        : pulseview
version     : "0.4.2+git.af021987"
release     : 1
homepage    : https://sigrok.org/wiki/PulseView
upstreams   :
    # A git snapshot of master, not the 0.4.2 release (2020): the release is
    # Qt5 only and wants the glibmm-2.4 flavour of libsigrok's C++ binding,
    # neither of which exists here. Master takes Qt6 and glibmm-2.68, and
    # is what the libsigrok snapshot in this repository is built to serve.
    - https://github.com/sigrokproject/pulseview/archive/af02198741b4e57c9f9b796bd5e6c0f2ae9f2f2b.tar.gz : c52ceb33fc528adc0e00a713930ae29742d704b8a08c1e875622216f80285915
summary     : Qt-based GUI for sigrok logic analyzers, oscilloscopes and more
description : |
    PulseView is the graphical frontend of the sigrok suite: capture from the
    logic analyzers, oscilloscopes and mixed-signal devices libsigrok drives,
    open and save sigrok session files, scroll and zoom the waveforms, and
    stack protocol decoders (I2C, SPI, UART, CAN, ...) on the captured
    channels to read the traffic as decoded bytes and annotations.

    Built against Qt 6 and the libsigrok C++ binding; the protocol decoders
    come from libsigrokdecode. Devices that need firmware uploaded when
    plugged in (many cheap Cypress FX2 analyzers) additionally need the
    sigrok-firmware-fx2lafw package.
license     :
    # COPYING is GPL-3.0; the sources are mixed. 187 files say GPL-2.0-or-later
    # and a few say GPL-3.0-or-later (and, per the README, some MIT), so the
    # combined program is bound by GPL-3.0-or-later.
    - GPL-3.0-or-later
    - GPL-2.0-or-later
    - MIT
builddeps   :
    - cmake(Qt6Widgets)
    - cmake(Qt6Svg)
    - cmake(Qt6LinguistTools)
    - cmake(Boost)
    - pkgconfig(glib-2.0)
    - pkgconfig(glibmm-2.68)
    - pkgconfig(libsigrokcxx)
    - pkgconfig(libsigrokdecode)
setup       : |
    %cmake -DENABLE_TESTS=ON
build       : |
    %cmake_build
install     : |
    %cmake_install
    %install_dir %(installroot)%(datadir)/licenses/%(name)
    %install_file COPYING %(installroot)%(datadir)/licenses/%(name)/COPYING
check       : |
    %cmake_test
