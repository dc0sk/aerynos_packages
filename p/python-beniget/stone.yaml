name        : python-beniget
version     : "0.4.2.post1"
release     : 1
homepage    : https://github.com/serge-sans-paille/beniget
upstreams   :
    - https://files.pythonhosted.org/packages/2e/27/5bb01af8f2860d431b98d0721b96ff2cea979106cae3f2d093ec74f6400c/beniget-0.4.2.post1.tar.gz : a0258537e65e7e14ec33a86802f865a667f949bb6c73646d55e42f7c45a052ae
summary     : Extract semantic information about static Python code
description : |
    Packaged as a build dependency of pythran, which scipy uses to compile
    some of its modules ahead of time.

    The version is pinned deliberately: pythran 0.18.1 requires gast~=0.6.0
    and beniget~=0.4.0, so the current 0.7.0 and 0.5.0 releases would not
    satisfy it.
license     : BSD-3-Clause
builddeps   :
    # Also a builddep, not just a rundep: rundeps are not installed into the
    # build container, and the check phase imports beniget, whose top-level
    # module imports gast.
    - python-gast
    - python-setuptools
rundeps     :
    - python(gast)
build       : |
    %pyproject_build
install     : |
    %pyproject_install
    %python_compile
check       : |
    cd %(installroot)
    PYTHONPATH="$(ls -d %(installroot)%(libdir)/python3.*/site-packages)" \
        python3 -c "import beniget, gast; m = gast.parse('a = 1\nb = a + 1\n'); d = beniget.DefUseChains(); d.visit(m); assert d.locals[m], 'no definitions found'; print('beniget ok:', len(d.locals[m]), 'defs')"
