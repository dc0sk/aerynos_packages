name        : python-scipy
version     : "1.18.1"
release     : 2
homepage    : https://scipy.org/
upstreams   :
    - https://files.pythonhosted.org/packages/7e/74/66de6258867beb2ef08f35f9f2ac017a52cacd5081714d239ff1a442d458/scipy-1.18.1.tar.gz : 52c4b7422442aba924d03ad4019852b08a92e64ea187b933135687bfe2747307
summary     : Fundamental algorithms for scientific computing in Python
description : |
    SciPy builds on numpy with algorithms for optimization, integration,
    interpolation, eigenvalue problems, signal and image processing,
    statistics, sparse matrices and more.
license     : BSD-3-Clause
tuning      :
    # The default flags are clang's and gfortran is GCC. -flto=thin reaches it
    # through FFLAGS and LDFLAGS and GCC rejects that spelling outright (it
    # wants -flto or -flto=N), and --icf is an lld/gold option that GNU ld does
    # not take. Both show up only as meson's "Compiler gfortran cannot compile
    # programs", with the real cause buried in its log.
    - lto: false
    - icf: false
builddeps   :
    # gfortran is GCC, and GCC drives binutils: without ld and as on PATH the
    # Fortran objects fail to link with "collect2: cannot find 'ld'". The rest
    # of the build environment is LLVM, which supplies ld.lld under a different
    # name, so binutils has to be asked for explicitly.
    - binary(gfortran)
    - binutils
    - binary(ninja)
    - binary(patchelf)
    - pkgconfig(openblas)
    - pkgconfig(pybind11)
    - python(cython)
    - python-build
    - python-installer
    - python-hypothesis
    - python-meson-python
    - python-pytest
    - python-sortedcontainers
    - python-numpy
    # scipy compiles several modules ahead of time with pythran; its
    # build-system.requires accepts pythran 0.19.
    - pythran
build       : |
    # Built with pythran, so the modules upstream expects to be compiled ahead
    # of time actually are. This previously carried -Duse-pythran=false because
    # pythran was not packaged, plus --skip-dependency-check to get past the
    # unconditional pythran entry in build-system.requires; both were dropped
    # once pythran was available, so the dependency check did its job again.
    #
    # 1.18.1 is the exception: its build-system.requires pins Cython <3.3,
    # meson-python <0.22 and pybind11 <3.1, and AerynOS now ships 3.3.1, 0.22.1
    # and 3.1.0. Those caps are upstream being conservative and the build is
    # checked by the suite below, so the check is skipped for this release; it
    # should go again once upstream's pins catch up.
    %pyproject_build --skip-dependency-check
install     : |
    %pyproject_install
    %python_compile
check       : |
    # Two gates. The smoke test first, because it asserts what the upstream
    # suite does not: that a real BLAS is linked rather than "unknown". Then
    # scipy's own suite, now that hypothesis is packaged. PytestTester only
    # reaches for xdist or coverage when asked, so plain pytest is enough.
    #
    # Run from installroot: %(workdir) is the scipy source tree and an import
    # from there picks up unbuilt sources.
    cd %(installroot)
    PYTHONPATH="$(ls -d %(installroot)%(libdir)/python3.*/site-packages)" \
        python3 %(pkgdir)/smoke-test.py
    # %(installroot)%(bindir) on PATH: the suite shells out to the installed
    # CLI tools, which live in the staged install rather than on the system.
    PATH="%(installroot)%(bindir):$PATH" \
    PYTHONPATH="$(ls -d %(installroot)%(libdir)/python3.*/site-packages)" \
        python3 %(pkgdir)/run-suite.py
