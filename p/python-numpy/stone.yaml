name        : python-numpy
version     : "2.5.4"
release     : 2
homepage    : https://numpy.org/
upstreams   :
    - https://files.pythonhosted.org/packages/95/b0/c7453d0b6e2073c3264468b106ee1563750cecc910965e67357e3698c83e/numpy-2.5.4.tar.gz : 9a94cf751c9ad8ebaa835bcd3d40dacf8534ad086b88c38029b65123c7999d2a
summary     : Fundamental package for scientific computing with Python
description : |
    NumPy provides the N-dimensional array that most of the Python scientific
    stack is built on, along with broadcasting, linear algebra, FFT and random
    number facilities, and the C API those are exposed through.
license     : BSD-3-Clause
builddeps   :
    - binary(ninja)
    # meson-python shells out to patchelf to fix up the rpath of the extension
    # modules it puts in the wheel.
    - binary(patchelf)
    - pkgconfig(openblas)
    - python(cython)
    - python-build
    - python-installer
    - python-hypothesis
    - python-meson-python
    - python-pytest
    # hypothesis imports sortedcontainers at module scope, and rundeps of a
    # builddep are not installed into the container.
    - python-sortedcontainers
build       : |
    %pyproject_build
install     : |
    %pyproject_install
    %python_compile
check       : |
    # Run from installroot, not %(workdir): the latter is the numpy source
    # tree, and an import from there resolves to the unbuilt sources, which
    # numpy refuses outright. The check itself is a file rather than an inline
    # script so that its python indentation survives the recipe.
    cd %(installroot)
    PYTHONPATH="$(ls -d %(installroot)%(libdir)/python3.*/site-packages)" \
        python3 %(pkgdir)/smoke-test.py
    # %(installroot)%(bindir) on PATH: the suite shells out to the installed
    # CLI tools, which live in the staged install rather than on the system.
    PATH="%(installroot)%(bindir):$PATH" \
    PYTHONPATH="$(ls -d %(installroot)%(libdir)/python3.*/site-packages)" \
        python3 -c "import numpy, sys; sys.exit(0 if numpy.test('fast', verbose=1) else 1)"
