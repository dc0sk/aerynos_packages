name        : python-gast
version     : "0.7.0"
release     : 2
homepage    : https://github.com/serge-sans-paille/gast
upstreams   :
    - https://files.pythonhosted.org/packages/91/f6/e73969782a2ecec280f8a176f2476149dd9dba69d5f8779ec6108a7721e6/gast-0.7.0.tar.gz : 0bb14cd1b806722e91ddbab6fb86bba148c22b40e7ff11e248974e04c8adfdae
summary     : Python AST that abstracts the underlying version
description : |
    Packaged as a build dependency of pythran, which scipy uses to compile
    some of its modules ahead of time.

    The version is pinned deliberately: pythran 0.18.1 requires gast~=0.6.0
    and beniget~=0.4.0, so the current 0.7.0 and 0.5.0 releases would not
    satisfy it.
license     : BSD-3-Clause
builddeps   :
    - python-setuptools

build       : |
    %pyproject_build
install     : |
    %pyproject_install
    %python_compile
check       : |
    cd %(installroot)
    PYTHONPATH="$(ls -d %(installroot)%(libdir)/python3.*/site-packages)" \
        python3 -c "import gast, ast; m = gast.parse('x = 1'); assert isinstance(m, gast.Module), m; print('gast', gast.__version__, 'ok')"
