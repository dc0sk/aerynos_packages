name        : limesuite
version     : "23.11.0"
release     : 2
homepage    : https://github.com/myriadrf/LimeSuite
upstreams   :
    - https://github.com/myriadrf/LimeSuite/archive/refs/tags/v23.11.0.tar.gz : fd8a448b92bc5ee4012f0ba58785f3c7e0a4d342b24e26275318802dfe00eb33
summary     : Driver and GUI toolkit for LMS7002M-based SDR platforms (LimeSDR)
description : |
    Lime Suite talks to LMS7002M-based software-defined radios - the LimeSDR-
    USB, LimeSDR-Mini, LimeNET-Micro and LimeSDR-PCIe family - over USB (FX3/
    FT601) or PCIe (Xillybus): libLimeSuite itself, the LimeUtil command-line
    tool (device discovery, firmware/gateware flashing, info dumps), the
    LimeQuickTest hardware diagnostic, and a SoapySDR plugin (the
    limesuite-soapysdr subpackage) that makes every LimeSDR visible to any
    SoapySDR-based application - SoapySDRUtil, GNU Radio's gr-soapysdr, or
    sdroxide's own LimeSuite backend (sdroxide-lime, which `dlopen`s this
    package's library at runtime rather than linking it).

    LimeSuiteGUI (the limesuite-gui subpackage) needs wxwidgets, now packaged
    for AerynOS; ENABLE_GUI auto-enables against it (CMake's own
    cmake_dependent_option, ENABLE_LIBRARY;wxWidgets_FOUND). The desktop
    launcher and icons are placed directly under /usr/share/applications and
    the hicolor icon theme rather than through CMake's own ENABLE_DESKTOP
    (disabled below), which installs them under share/Lime/Desktop alongside
    install/uninstall shell scripts meant to be run post-install to copy
    them into place and refresh the XDG caches - a postinst-script model
    this package format has no equivalent hook for, so the files are placed
    where they belong directly instead.

    Still not built: the Octave plugin (needs liboctave-dev, unpackaged and
    a niche use case - and this system's own Octave is a Flatpak, which a
    native build cannot link against regardless). It is the one remaining
    optional CMake subdirectory that cleanly no-ops when its dependency is
    absent rather than failing the build.

    The one connection backend confirmed to need a system library is FX3
    (LimeSDR-USB's normal USB3 mode), which needs libusb-1.0 - see
    builddeps below. The others (FTDI, Xillybus/PCIe, remote/SPI/EVB7) each
    probe for their own dependency independently and silently build without
    that backend if it is missing, the same pattern as the GUI/Octave above;
    none of those extra dependencies are packaged for AerynOS yet either, so
    this build covers USB (FX3) LimeSDRs and whichever of the others happen
    to need nothing beyond what is already present.
license     :
    # oglGraph (the limesuite-gui subpackage's plotting widget) statically
    # links a vendored copy of GLEW (src/oglGraph/glew), carrying no licence
    # file of its own here but upstream (BSD/MIT, plus SGI's original terms
    # on some of the extension headers it wraps).
    - Apache-2.0
    - BSD-3-Clause
    - MIT
    - SGI-B-2.0
builddeps   :
    - pkgconfig(libusb-1.0)
    # The limesuite-soapysdr subpackage below.
    - pkgconfig(SoapySDR)
    # The limesuite-gui subpackage below (LimeSuiteGUI, and oglGraph, the
    # OpenGL plotting widget it links - GLEW itself is vendored straight
    # into oglGraph's own sources, not an external dependency).
    - cmake(wxWidgets)
    - pkgconfig(gl)
    - pkgconfig(glu)
    - binary(desktop-file-validate)
setup       : |
    # CMAKE_POLICY_VERSION_MINIMUM: upstream declares cmake_minimum_required
    # (VERSION 3.1.3), and CMake 4 refuses to configure anything below 3.5 at
    # all - this is the escape hatch CMake's own error message points at.
    #
    # Not -DUDEV_RULES_PATH: upstream's own udev-rules/64-limesuite.rules
    # uses MODE="666" (world-writable to every local user and process); see
    # pkg/64-limesuite.rules for the TAG+="uaccess" replacement installed
    # below instead, covering the same device IDs.
    #
    # -DENABLE_DESKTOP=OFF: see description: above for why the launcher and
    # icons are placed by hand in install: instead of through this option.
    %cmake \
        -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
        -DENABLE_DESKTOP=OFF
build       : |
    %cmake_build
install     : |
    %cmake_install

    %install_dir %(installroot)%(udevrulesdir)
    %install_file %(pkgdir)/64-limesuite.rules %(installroot)%(udevrulesdir)/64-limesuite.rules

    # ENABLE_DESKTOP=OFF above skips CMake's own install of these (into a
    # non-standard share/Lime/Desktop location meant for a postinst script
    # to relocate - see description:); place them directly instead.
    %install_dir %(installroot)%(datadir)/applications
    %install_file Desktop/lime-suite.desktop %(installroot)%(datadir)/applications/lime-suite.desktop
    desktop-file-validate %(installroot)%(datadir)/applications/lime-suite.desktop

    for _size in 16 22 32 48 64 128; do
        %install_dir %(installroot)%(datadir)/icons/hicolor/${_size}x${_size}/apps
        %install_file Desktop/lime-suite-${_size}.png %(installroot)%(datadir)/icons/hicolor/${_size}x${_size}/apps/lime-suite.png
    done
# No check phase: LimeQuickTest *is* upstream's test suite, but it is a
# hardware diagnostic that talks to a real LimeSDR over USB/PCIe, not
# something ctest runs - there is no automated suite this build phase could
# run without the actual radio attached.
packages    :
    - "limesuite-soapysdr":
        summary: "SoapySDR module for LimeSDR devices"
        description: |
            The SoapySDR plugin for the LMS7002M-based LimeSDR family, loaded by
            SoapySDR at runtime. Install this to make LimeSDR devices visible to
            any SoapySDR-based application without needing libLimeSuite linked
            directly - SoapySDRUtil, GNU Radio's gr-soapysdr, or anything else
            built against SoapySDR rather than this package's own API.
        paths:
            - /usr/lib/SoapySDR
        rundeps:
            - soapysdr
    - "limesuite-gui":
        summary: "Graphical configuration utility for LimeSDR devices"
        description: |
            LimeSuiteGUI, upstream's low-level hardware configuration and
            firmware-update tool for the LMS7002M-based LimeSDR family, plus its
            desktop launcher and icons. Everything else in the limesuite package
            (the library, LimeUtil, LimeQuickTest) has no GUI dependency of its
            own; install this only if you want the graphical tool too.
        paths:
            - /usr/bin/LimeSuiteGUI
            - /usr/share/applications/lime-suite.desktop
            - /usr/share/icons/hicolor
