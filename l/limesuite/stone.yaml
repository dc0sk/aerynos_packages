name        : limesuite
version     : "23.11.0"
release     : 1
homepage    : https://github.com/myriadrf/LimeSuite
upstreams   :
    - https://github.com/myriadrf/LimeSuite/archive/refs/tags/v23.11.0.tar.gz : fd8a448b92bc5ee4012f0ba58785f3c7e0a4d342b24e26275318802dfe00eb33
summary     : Driver and GUI toolkit for LMS7002M-based SDR platforms (LimeSDR)
description : |
    Lime Suite talks to LMS7002M-based software-defined radios - the LimeSDR-
    USB, LimeSDR-Mini, LimeNET-Micro and LimeSDR-PCIe family - over USB (FX3/
    FT601) or PCIe (Xillybus): libLimeSuite itself, the LimeUtil command-line
    tool (device discovery, firmware/gateware flashing, info dumps), the
    LimeQuickTest hardware diagnostic, and a SoapySDR plugin (the
    limesuite-soapysdr subpackage) that makes every LimeSDR visible to any
    SoapySDR-based application - SoapySDRUtil, GNU Radio's gr-soapysdr, or
    sdroxide's own LimeSuite backend (sdroxide-lime, which `dlopen`s this
    package's library at runtime rather than linking it).

    Not built here: LimeSuiteGUI and the freedesktop menu entry that launches
    it (CMake's own ENABLE_GUI/ENABLE_DESKTOP options - need wxWidgets, not
    yet packaged for AerynOS), and the Octave plugin (needs liboctave-dev,
    likewise unpackaged and a niche use case). Both are optional CMake
    subdirectories that cleanly no-op when their dependency is absent rather
    than failing the build, so omitting them costs nothing else here -
    LimeUtil and LimeQuickTest both build as CLI-only tools regardless (the
    latter's own GUI test-results viewer is the only part that needs FLTK/
    GLUT, gated the same way).

    The one connection backend confirmed to need a system library is FX3
    (LimeSDR-USB's normal USB3 mode), which needs libusb-1.0 - see
    builddeps below. The others (FTDI, Xillybus/PCIe, remote/SPI/EVB7) each
    probe for their own dependency independently and silently build without
    that backend if it is missing, the same pattern as the GUI/Octave above;
    none of those extra dependencies are packaged for AerynOS yet either, so
    this build covers USB (FX3) LimeSDRs and whichever of the others happen
    to need nothing beyond what is already present.
license     : Apache-2.0
builddeps   :
    - pkgconfig(libusb-1.0)
    # The limesuite-soapysdr subpackage below.
    - pkgconfig(SoapySDR)
setup       : |
    # CMAKE_POLICY_VERSION_MINIMUM: upstream declares cmake_minimum_required
    # (VERSION 3.1.3), and CMake 4 refuses to configure anything below 3.5 at
    # all - this is the escape hatch CMake's own error message points at.
    #
    # Not -DUDEV_RULES_PATH: upstream's own udev-rules/64-limesuite.rules
    # uses MODE="666" (world-writable to every local user and process); see
    # pkg/64-limesuite.rules for the TAG+="uaccess" replacement installed
    # below instead, covering the same device IDs.
    %cmake \
        -DCMAKE_POLICY_VERSION_MINIMUM=3.5
build       : |
    %cmake_build
install     : |
    %cmake_install

    %install_dir %(installroot)%(udevrulesdir)
    %install_file %(pkgdir)/64-limesuite.rules %(installroot)%(udevrulesdir)/64-limesuite.rules
# No check phase: LimeQuickTest *is* upstream's test suite, but it is a
# hardware diagnostic that talks to a real LimeSDR over USB/PCIe, not
# something ctest runs - there is no automated suite this build phase could
# run without the actual radio attached.
packages    :
    - "limesuite-soapysdr":
        summary: "SoapySDR module for LimeSDR devices"
        description: |
            The SoapySDR plugin for the LMS7002M-based LimeSDR family, loaded by
            SoapySDR at runtime. Install this to make LimeSDR devices visible to
            any SoapySDR-based application without needing libLimeSuite linked
            directly - SoapySDRUtil, GNU Radio's gr-soapysdr, or anything else
            built against SoapySDR rather than this package's own API.
        paths:
            - /usr/lib/SoapySDR
        rundeps:
            - soapysdr
