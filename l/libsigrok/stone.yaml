name        : libsigrok
version     : "0.6.0+git.0bc24877"
release     : 2
homepage    : https://sigrok.org/wiki/Libsigrok
upstreams   :
    # A git snapshot of master, not the 0.5.2 release: PulseView needs
    # libsigrok's C++ binding (libsigrokcxx), the 0.5.2 release can only
    # build that against glibmm-2.4 and AerynOS has glibmm 2.68, and master
    # is the first to accept glibmm-2.68 ("Accept glibmm-2.68 when glibmm-2.4
    # is not available", configure.ac). master is 0.6.0 in development and
    # carries years of driver additions the 2019 release does not. A GitHub
    # archive has no configure script, so setup: runs autoreconf first.
    - https://github.com/sigrokproject/libsigrok/archive/0bc2487778e660f4d3116729b6f4aee2b1996bb0.tar.gz : 6bdaa8ae47929050ab6aa125da9eb1cbeeeb0d7b2cef7e1f13f3809a7c13b40a
summary     : Hardware drivers and acquisition library of the sigrok project
description : |
    libsigrok is the backend of the sigrok signal-analysis suite: drivers for
    a few hundred logic analyzers, oscilloscopes, multimeters, power supplies,
    sound-level meters, scales and other test instruments, plus the code to
    acquire, convert and read/write sample data (sigrok session files, VCD,
    CSV, WAV, ...). sigrok-cli and PulseView are built on top of it.

    Built against the USB, HID (hidraw), serial, Bluetooth and zip (session file)
    libraries that are packaged for AerynOS. Drivers needing libftdi1,
    libieee1284, a GPIB library or librevisa are not built, as none of those
    are packaged here; configure leaves them out on its own when the library
    is absent. Many cheap USB logic analyzers (Cypress FX2 based "Saleae
    clones") need firmware uploaded to them - that is the separate
    sigrok-firmware-fx2lafw package.

    The C++ binding (libsigrokcxx) is built, against glibmm 2.68, because
    PulseView needs it. The Python, Ruby and Java bindings are not.
license     : GPL-3.0-or-later
builddeps   :
    - pkgconfig(glib-2.0)
    - pkgconfig(libzip)
    - pkgconfig(libusb-1.0)
    - pkgconfig(libserialport)
    - pkgconfig(hidapi-hidraw)
    - pkgconfig(bluez)
    - pkgconfig(nettle)
    # The C++ binding; master takes glibmm-2.68 when 2.4 is absent.
    - pkgconfig(glibmm-2.68)
    # configure.ac uses AX_CXX_COMPILE_STDCXX, which autoreconf needs the
    # macro for - a snapshot carries no generated configure to bring it.
    - autoconf-archive
    # The C++ binding is generated from the C headers by a script that parses
    # Doxygen's XML output; configure reports "C++: no (missing: Doxygen)"
    # and silently drops the binding without it.
    - binary(doxygen)
    - binary(libtoolize)
setup       : |
    # AerynOS's libtool is slibtool, and it cannot do the one link master's
    # build relies on: Makefile.am makes src/libdrivers.o by handing libtool
    # an output ending in .o, which slibtool takes for an executable and runs
    # the compiler with an empty -o ("clang: error: argument to '-o' is
    # missing"). The 0.5.2 release tarball had worked because it carries the
    # generated GNU libtool script. The patch does that partial link with ld
    # -r over the same three archives in the same order, which is all the
    # rule was after (it keeps the driver list's start and end markers around
    # the drivers), and also leaves a copy in src/.libs/ and points the stub
    # libtool object at it, since slibtool looks for the PIC object there.
    %patch %(pkgdir)/0001-link-drivers-object-without-libtool.patch

    # autoreconf is run by hand rather than through boulder's reconfigure
    # macro, which runs configure with no options and cannot pass the ones
    # below through. (Do not write macro names in comments: they expand
    # there too.)
    CONFIG_SHELL=/usr/bin/dash; export CONFIG_SHELL
    SHELL=/usr/bin/dash; export SHELL
    autoreconf -vfi
    %configure \
        --disable-static \
        --enable-cxx \
        --disable-python \
        --disable-ruby \
        --disable-java
build       : |
    %make
install     : |
    %make_install

    # Upstream's own two-step rules: 60 tags each known device with
    # ID_SIGROK=1, and 61-uaccess then grants the logged-in seat user an ACL
    # on those. (61-libsigrok-plugdev.rules is the group-based alternative,
    # not shipped; there is no plugdev-style group to rely on here.)
    %install_dir %(installroot)%(udevrulesdir)
    %install_file contrib/60-libsigrok.rules %(installroot)%(udevrulesdir)/60-libsigrok.rules
    %install_file contrib/61-libsigrok-uaccess.rules %(installroot)%(udevrulesdir)/61-libsigrok-uaccess.rules

    %install_dir %(installroot)%(datadir)/licenses/%(name)
    %install_file COPYING %(installroot)%(datadir)/licenses/%(name)/COPYING
# No check phase. `make check` fails before running anything: the unit test
# tests/strutil.c calls ck_assert_msg() with three arguments, and the current
# `check` library (0.15+) requires a format string as the fourth, so the test
# binary does not compile ("too few arguments to function call, expected at
# least 4, have 3"). That is upstream's test code aging against a newer
# `check`, not a defect in libsigrok itself, which built and installed fine.
# The library is exercised for real through sigrok-cli instead (see its recipe).
