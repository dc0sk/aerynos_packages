name        : libsigrokdecode
version     : "0.6.0+git.71f45144"
release     : 2
homepage    : https://sigrok.org/wiki/Libsigrokdecode
upstreams   :
    # A git snapshot of master, not the 0.5.3 release: PulseView master uses
    # decoder API the release does not have (logic output channels:
    # srd_decoder.logic_output_channels, SRD_OUTPUT_LOGIC and
    # srd_proto_data_logic), so it does not compile against 0.5.3. Master is
    # 0.6.0 in development. A GitHub archive has no configure script, so
    # setup: runs autoreconf first.
    - https://github.com/sigrokproject/libsigrokdecode/archive/71f451443029322d57376214c330b518efd84f88.tar.gz : a2fa2d6675775d64c43575febaf02c498a977c8bdc4a8dd3c7e5c87d1c5d7887
summary     : Protocol decoder library of the sigrok project
description : |
    libsigrokdecode runs sigrok's protocol decoders - over a hundred, written
    in Python: I2C, SPI, UART, CAN, 1-Wire, JTAG, SWD, USB, many more -
    against captured logic-analyzer sample data and turns raw edges into
    annotated, stackable protocol-level output. It embeds the Python
    interpreter. sigrok-cli and PulseView use it to decode captures.
license     :
    # The library itself is GPL-3.0-or-later; nearly all of the decoders
    # (decoders/*/pd.py) are GPL-2.0-or-later, a few GPL-3.0-or-later.
    - GPL-3.0-or-later
    - GPL-2.0-or-later
builddeps   :
    - pkgconfig(glib-2.0)
    - pkgconfig(python3-embed)
    - pkgconfig(check)
setup       : |
    # autoreconf by hand, so the options can be passed to configure (boulder's
    # reconfigure macro runs it with none). Unlike the 0.5.3 release, master's
    # configure tries python3-embed, so it links libpython without help.
    CONFIG_SHELL=/usr/bin/dash; export CONFIG_SHELL
    SHELL=/usr/bin/dash; export SHELL
    autoreconf -vfi
    %configure --disable-static
build       : |
    %make
install     : |
    %make_install
    %install_dir %(installroot)%(datadir)/licenses/%(name)
    %install_file COPYING %(installroot)%(datadir)/licenses/%(name)/COPYING
check       : |
    %make check
