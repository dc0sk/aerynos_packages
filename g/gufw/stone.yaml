name        : gufw
version     : "26.04"
release     : 1
homepage    : https://costales.github.io/projects/gufw/
upstreams   :
    - https://github.com/costales/gufw/archive/refs/tags/26.04.tar.gz : e2da0bee3481331c4c7b791b3d7ec8e6e1b1fa86274d56a60decfbf1b90f568f
summary     : An easy, intuitive way to manage your Linux firewall
description : |
    Gufw is a graphical interface for ufw, making it easy to allow or block
    pre-configured, common p2p, or individual ports and services.
license     : GPL-3.0-or-later
builddeps   :
    - binary(intltool-merge)
    - binary(msgfmt)
    - python(python-distutils-extra)
rundeps     :
    - binary(python3)
    - python(pygobject)
    - sysbinary(ufw)
    - gtk-3
    - polkit
build       : |
    %python_setup
install     : |
    %python_install
